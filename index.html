<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐶 팝팝 가나디 게임 (Apple 10 Pop!)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@600;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FFFDF7;
      --card-bg: #FFFFFF;
      --primary: #FF5A79;
      --primary-hover: #FF3B60;
      --secondary: #FFDE59;
      --accent: #5CE1E6;
      --dark: #242424;
      --shadow: 4px 4px 0px #242424;
      --shadow-sm: 2px 2px 0px #242424;
      --shadow-lg: 6px 6px 0px #242424;
      --apple-red: #FF4D6D;
      --apple-leaf: #70E000;
      --apple-border: #242424;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFF6E5;
      background-image:
        radial-gradient(#FFD166 18%, transparent 18%),
        radial-gradient(#FF85A1 18%, transparent 18%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      font-family: 'Jua', 'Outfit', sans-serif;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: none;
    }

    .main-container {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border: 3.5px solid var(--dark);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* 상단 헤더 & 바 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px dashed var(--dark);
      padding-bottom: 14px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 2px 2px 0px var(--dark);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-badge {
      background: var(--secondary);
      border: 2px solid var(--dark);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stat-pill {
      background: #FFF9DB;
      border: 2.5px solid var(--dark);
      border-radius: 18px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .stat-pill.time-pill {
      background: #E8F8F5;
    }

    .stat-pill.time-pill.urgent {
      background: #FFE3E3;
      animation: heartBeat 0.7s infinite alternate;
      color: #E03131;
    }

    @keyframes heartBeat {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.06);
      }
    }

    .stat-label {
      font-size: 13px;
      color: #666;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    .controls-bar {
      display: flex;
      gap: 8px;
    }

    /* 버튼 스타일 */
    .neo-btn {
      background: #FFF;
      border: 2.5px solid var(--dark);
      border-radius: 16px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.1s ease;
    }

    .neo-btn:hover {
      transform: translate(-1.5px, -1.5px);
      box-shadow: var(--shadow);
    }

    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--dark);
    }

    .neo-btn-primary {
      background: var(--primary);
      color: white;
    }

    .neo-btn-primary:hover {
      background: var(--primary-hover);
    }

    .neo-btn-accent {
      background: var(--accent);
    }

    .neo-btn-yellow {
      background: var(--secondary);
    }

    /* 게임 보드 래퍼 */
    .board-wrapper {
      position: relative;
      background: #FAFAFA;
      border: 3px solid var(--dark);
      border-radius: 20px;
      padding: 12px;
      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 440px;
      overflow: hidden;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 5px;
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    .apple-number {
      position: absolute;
      top: 66%;
      left: 36%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      font-weight: 900;
      color: #FF3B60;
      background: rgba(255, 255, 255, 0.95);
      border: 1.8px solid var(--dark);
      border-radius: 6px;
      padding: 0px 4px;
      line-height: 1.1;
      box-shadow: 1.5px 1.5px 0px var(--dark);
      pointer-events: none;
    }

    .apple-item.selected {
      background-color: #FFF3B0;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(255, 222, 89, 0.95), var(--shadow-sm);
      border-color: #242424;
      z-index: 5;
    }

    .apple-item.selected .apple-number {
      background: #FFDE59;
      color: #242424;
    }

    .apple-item.cleared {
      visibility: hidden;
      pointer-events: none;
    }

    /* 드래그 사각형 셀렉터 박스 */
    .selection-box {
      position: absolute;
      border: 3px dashed #242424;
      background: rgba(92, 225, 230, 0.28);
      border-radius: 12px;
      pointer-events: none;
      display: none;
      z-index: 10;
      box-shadow: 0 0 16px rgba(92, 225, 230, 0.4);
    }

    /* 현재 합계 플로팅 인디케이터 */
    .sum-indicator {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #FFF;
      border: 2.5px solid var(--dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 800;
      box-shadow: var(--shadow);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .sum-indicator.match {
      background: #70E000;
      color: white;
      transform: scale(1.12);
      box-shadow: 0 0 14px rgba(112, 224, 0, 0.7);
    }

    .sum-indicator.overflow {
      background: #FF6B6B;
      color: white;
    }

    /* 팝업 모달 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(36, 36, 36, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      border-radius: 24px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-card {
      background: #FFFFFF;
      border: 3.5px solid var(--dark);
      border-radius: 24px;
      padding: 24px 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: popUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popUp {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--primary);
    }

    .modal-desc {
      font-size: 15px;
      color: #555;
      line-height: 1.4;
    }

    .rank-input {
      width: 100%;
      padding: 10px 14px;
      border: 2.5px solid var(--dark);
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      outline: none;
      text-align: center;
      background: #FFF9DB;
      box-shadow: var(--shadow-sm);
    }

    .rank-list-table {
      max-height: 220px;
      overflow-y: auto;
      border: 2.5px solid var(--dark);
      border-radius: 14px;
      background: #FAF8F5;
      padding: 6px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .rank-item:nth-child(even) {
      background: #FFF;
    }

    .rank-badge-top {
      color: #FF5A79;
    }

    /* 반응형 화면 처리 */
    @media (max-width: 680px) {
      .game-board {
        gap: 3px;
      }

      .apple-item {
        border-width: 2px;
        box-shadow: 1.5px 1.5px 0px var(--dark);
      }

      .apple-number {
        font-size: 12px;
      }

      .logo-title {
        font-size: 20px;
      }

      .stat-pill {
        padding: 4px 10px;
      }

      .stat-value {
        font-size: 16px;
      }

      .neo-btn {
        padding: 6px 10px;
        font-size: 13px;
      }

      .board-wrapper {
        min-height: 330px;
        padding: 8px;
      }
    }

    /* 팝핑 애니메이션 */
    .pop-bubble {
      position: absolute;
      pointer-events: none;
      font-size: 18px;
      font-weight: 900;
      color: #FF4D6D;
      animation: floatFade 0.8s forwards;
      z-index: 50;
      text-shadow: 2px 2px 0px white, -2px -2px 0px white;
    }

    @keyframes floatFade {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(-40px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="main-container">
    <!-- 헤더 영역 -->
    <header class="header-bar">
      <div class="logo-area">
        <h1 class="logo-title">🐶 가나디 게임 <span class="logo-badge">합이 10!</span></h1>
      </div>

      <div class="stats-bar">
        <div class="stat-pill time-pill" id="time-pill">
          <span class="stat-label">⏳ 시간</span>
          <span class="stat-value" id="timer-display">02:00</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">⭐ 점수</span>
          <span class="stat-value" id="score-display">0</span>
        </div>
      </div>

      <div class="controls-bar">
        <button class="neo-btn" id="pause-btn" title="일시정지">⏸️ 일시정지</button>
        <button class="neo-btn neo-btn-yellow" id="ranking-btn" title="랭킹 보기">🏆 랭킹</button>
        <button class="neo-btn" id="sound-btn" title="사운드 켜기/끄기">🔊 ON</button>
      </div>
    </header>

    <!-- 게임 보드 래퍼 -->
    <div class="board-wrapper" id="board-wrapper">
      <!-- 실시간 선택 합계 인디케이터 -->
      <div class="sum-indicator" id="sum-indicator">
        <span>선택 합계:</span>
        <span id="current-sum-val">0</span>
      </div>

      <!-- 사과 그리드 -->
      <div class="game-board" id="game-board"></div>

      <!-- 드래그 박스 영역 -->
      <div class="selection-box" id="selection-box"></div>

      <!-- 일시정지 모달 -->
      <div class="modal-overlay" id="pause-modal">
        <div class="modal-card">
          <h2 class="modal-title">☕ 잠깐 쉬는 중!</h2>
          <p class="modal-desc">시간이 멈춰있어요. 숨 고르고 다시 가나디를 팝해볼까요?</p>
          <button class="neo-btn neo-btn-primary" id="resume-btn" style="padding: 12px; font-size: 18px;">▶️
            계속하기</button>
        </div>
      </div>

      <!-- 게임 종료 모달 -->
      <div class="modal-overlay" id="gameover-modal">
        <div class="modal-card">
          <h2 class="modal-title" id="gameover-title">🎉 타임 오버!</h2>
          <p class="modal-desc">
            최종 점수: <strong id="final-score" style="color:var(--primary); font-size: 24px;">0</strong>점
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="player-name-input" class="rank-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8" />
            <button class="neo-btn neo-btn-accent" id="save-score-btn">💾 랭킹 등록하기</button>
          </div>
          <button class="neo-btn neo-btn-yellow" id="restart-btn" style="margin-top: 6px;">🔄 새 게임 시작</button>
        </div>
      </div>

      <!-- 랭킹 모달 -->
      <div class="modal-overlay" id="ranking-modal">
        <div class="modal-card">
          <h2 class="modal-title">🏆 명예의 전당 TOP 10</h2>
          <div class="rank-list-table" id="ranking-list">
            <!-- 랭킹 목록 주입 -->
          </div>
          <button class="neo-btn neo-btn-primary" id="close-rank-btn">닫기</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ========================================================
       사운드 시스템 (Web Audio API - 무음 에셋 독립 완결형)
       ======================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSelect() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playSuccess() {
        if (!this.enabled) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C (팡파레)
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = this.ctx.currentTime + idx * 0.06;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.16);
        });
      }
      playGameOver() {
        if (!this.enabled) return;
        this.init();
        const notes = [440, 392, 349.23, 293.66];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = this.ctx.currentTime + idx * 0.14;
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.2);
        });
      }
    }

    const sound = new SoundFX();

    /* ========================================================
       게임 상태 및 데이터 관리
       ======================================================== */
    const COLS = 17;
    const ROWS = 10;
    const TOTAL_TIME = 120; // 2분

    let boardData = [];
    let score = 0;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let isPaused = false;
    let isGameOver = false;

    // 드래그 좌표 및 선택 상태
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragRect = { left: 0, top: 0, right: 0, bottom: 0 };
    let selectedIndices = new Set();

    // DOM 요소
    const gameBoard = document.getElementById('game-board');
    const boardWrapper = document.getElementById('board-wrapper');
    const selectionBox = document.getElementById('selection-box');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const timePill = document.getElementById('time-pill');
    const sumIndicator = document.getElementById('sum-indicator');
    const currentSumVal = document.getElementById('current-sum-val');

    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const soundBtn = document.getElementById('sound-btn');
    const rankingBtn = document.getElementById('ranking-btn');
    const closeRankBtn = document.getElementById('close-rank-btn');
    const restartBtn = document.getElementById('restart-btn');
    const saveScoreBtn = document.getElementById('save-score-btn');

    const pauseModal = document.getElementById('pause-modal');
    const gameoverModal = document.getElementById('gameover-modal');
    const rankingModal = document.getElementById('ranking-modal');
    const rankingList = document.getElementById('ranking-list');
    const finalScore = document.getElementById('final-score');
    const playerNameInput = document.getElementById('player-name-input');

    /* ========================================================
       초기화 & 게임 생성
       ======================================================== */
    function initGame() {
      score = 0;
      timeLeft = TOTAL_TIME;
      isPaused = false;
      isGameOver = false;
      scoreDisplay.textContent = '0';
      updateTimerDisplay();
      timePill.classList.remove('urgent');
      sumIndicator.style.display = 'none';
      pauseModal.style.display = 'none';
      gameoverModal.style.display = 'none';
      rankingModal.style.display = 'none';

      // 1~9 사이의 랜덤 숫자 사과 생성
      boardData = [];
      gameBoard.innerHTML = '';

      for (let i = 0; i < ROWS * COLS; i++) {
        const num = Math.floor(Math.random() * 9) + 1;
        boardData.push({ id: i, number: num, cleared: false });

        const cell = document.createElement('div');
        cell.className = 'apple-item';
        cell.dataset.index = i;
        cell.innerHTML = `<span class="apple-number">${num}</span>`;
        gameBoard.appendChild(cell);
      }

      startTimer();
    }

    /* 타이머 로직 */
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused && !isGameOver) {
          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 15) {
            timePill.classList.add('urgent');
          }

          if (timeLeft <= 0) {
            endGame();
          }
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      pauseModal.style.display = isPaused ? 'flex' : 'none';
    }

    function endGame() {
      isGameOver = true;
      clearInterval(timerInterval);
      sound.playGameOver();
      finalScore.textContent = score;
      gameoverModal.style.display = 'flex';
      playerNameInput.value = '';
      playerNameInput.focus();
    }

    /* ========================================================
       드래그 인터랙션 & 합계 10 판정
       ======================================================== */
    function getBoardRelativeCoords(e) {
      const rect = gameBoard.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.max(0, Math.min(clientX - rect.left, rect.width)),
        y: Math.max(0, Math.min(clientY - rect.top, rect.height))
      };
    }

    function onPointerDown(e) {
      if (isPaused || isGameOver) return;
      if (e.target.closest('.modal-overlay') || e.target.closest('button')) return;

      isDragging = true;
      const coords = getBoardRelativeCoords(e);
      dragStartX = coords.x;
      dragStartY = coords.y;

      updateDragRect(coords.x, coords.y);
      selectionBox.style.display = 'block';
      selectedIndices.clear();
      updateSelection();
    }

    function onPointerMove(e) {
      if (!isDragging || isPaused || isGameOver) return;
      const coords = getBoardRelativeCoords(e);
      updateDragRect(coords.x, coords.y);
      updateSelection();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      selectionBox.style.display = 'none';
      sumIndicator.style.display = 'none';

      // 선택된 사과들의 합 검증
      let currentSum = 0;
      selectedIndices.forEach(idx => {
        if (!boardData[idx].cleared) {
          currentSum += boardData[idx].number;
        }
      });

      if (currentSum === 10 && selectedIndices.size > 0) {
        // 성공: 합이 10!
        sound.playSuccess();
        const clearedCount = selectedIndices.size;
        score += clearedCount;
        scoreDisplay.textContent = score;

        selectedIndices.forEach(idx => {
          boardData[idx].cleared = true;
          const el = gameBoard.children[idx];
          if (el) {
            el.classList.add('cleared');
            createBubble(el, `+${clearedCount}`);
          }
        });

        // 남은 사과 확인
        checkRemainingApples();
      }

      // 선택 상태 초기화
      Array.from(gameBoard.children).forEach(el => el.classList.remove('selected'));
      selectedIndices.clear();
    }

    function updateDragRect(curX, curY) {
      const left = Math.min(dragStartX, curX);
      const top = Math.min(dragStartY, curY);
      const width = Math.abs(curX - dragStartX);
      const height = Math.abs(curY - dragStartY);

      dragRect = { left, top, right: left + width, bottom: top + height };

      selectionBox.style.left = `${left}px`;
      selectionBox.style.top = `${top}px`;
      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
    }

    function updateSelection() {
      const boardRect = gameBoard.getBoundingClientRect();
      const prevSize = selectedIndices.size;
      selectedIndices.clear();
      let currentSum = 0;

      Array.from(gameBoard.children).forEach((cell, idx) => {
        if (boardData[idx].cleared) return;

        const cellRect = cell.getBoundingClientRect();
        const cellLeft = cellRect.left - boardRect.left;
        const cellTop = cellRect.top - boardRect.top;
        const cellRight = cellLeft + cellRect.width;
        const cellBottom = cellTop + cellRect.height;

        // 드래그 영역과 겹치는지 체크
        const isOverlap = !(
          cellRight < dragRect.left ||
          cellLeft > dragRect.right ||
          cellBottom < dragRect.top ||
          cellTop > dragRect.bottom
        );

        if (isOverlap) {
          selectedIndices.add(idx);
          cell.classList.add('selected');
          currentSum += boardData[idx].number;
        } else {
          cell.classList.remove('selected');
        }
      });

      if (selectedIndices.size > prevSize) {
        sound.playSelect();
      }

      // 합계 인디케이터 갱신
      if (selectedIndices.size > 0) {
        sumIndicator.style.display = 'flex';
        currentSumVal.textContent = currentSum;

        sumIndicator.classList.remove('match', 'overflow');
        if (currentSum === 10) {
          sumIndicator.classList.add('match');
        } else if (currentSum > 10) {
          sumIndicator.classList.add('overflow');
        }
      } else {
        sumIndicator.style.display = 'none';
      }
    }

    function createBubble(targetElement, text) {
      const rect = targetElement.getBoundingClientRect();
      const wrapperRect = boardWrapper.getBoundingClientRect();
      const bubble = document.createElement('div');
      bubble.className = 'pop-bubble';
      bubble.textContent = text;
      bubble.style.left = `${rect.left - wrapperRect.left + 5}px`;
      bubble.style.top = `${rect.top - wrapperRect.top - 10}px`;
      boardWrapper.appendChild(bubble);
      setTimeout(() => bubble.remove(), 800);
    }

    function checkRemainingApples() {
      const allCleared = boardData.every(apple => apple.cleared);
      if (allCleared) {
        // 모든 사과 클리어 보너스!
        score += 50;
        scoreDisplay.textContent = score;
        endGame();
      }
    }

    /* ========================================================
       랭킹 관리 (localStorage 기반 상위 10개)
       ======================================================== */
    const RANK_KEY = 'apple_game_top_ranks';

    function getRankings() {
      try {
        const data = localStorage.getItem(RANK_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveScore() {
      const name = (playerNameInput.value.trim() || '익명의 고딩').substring(0, 8);
      const ranks = getRankings();
      const newEntry = {
        name: name,
        score: score,
        date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })
      };

      ranks.push(newEntry);
      ranks.sort((a, b) => b.score - a.score);
      const top10 = ranks.slice(0, 10);

      try {
        localStorage.setItem(RANK_KEY, JSON.stringify(top10));
      } catch (e) { }

      gameoverModal.style.display = 'none';
      showRankings();
    }

    function showRankings() {
      const ranks = getRankings();
      rankingList.innerHTML = '';

      if (ranks.length === 0) {
        rankingList.innerHTML = `<div style="padding: 20px; color:#888; text-align:center;">아직 랭킹 기록이 없어요!<br>첫 번째 주인공이 되어보세요 🐶</div>`;
      } else {
        ranks.forEach((entry, idx) => {
          const item = document.createElement('div');
          item.className = 'rank-item';
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}등`;
          item.innerHTML = `
            <span>
              <strong class="rank-badge-top">${medal}</strong> 
              <span style="margin-left: 6px;">${escapeHtml(entry.name)}</span>
            </span>
            <span>
              <strong style="color:var(--primary); font-size:16px;">${entry.score}</strong> 점
              <small style="color:#888; font-size:11px; margin-left: 4px;">(${entry.date})</small>
            </span>
          `;
          rankingList.appendChild(item);
        });
      }

      rankingModal.style.display = 'flex';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ========================================================
       이벤트 리스너 바인딩
       ======================================================== */
    // 보드 드래그/터치 리스너
    gameBoard.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    gameBoard.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // 컨트롤 버튼들
    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', initGame);

    rankingBtn.addEventListener('click', showRankings);
    closeRankBtn.addEventListener('click', () => {
      rankingModal.style.display = 'none';
    });

    saveScoreBtn.addEventListener('click', saveScore);
    playerNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveScore();
    });

    soundBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundBtn.textContent = sound.enabled ? '🔊 ON' : '🔇 OFF';
      soundBtn.style.opacity = sound.enabled ? '1' : '0.6';
    });

    // 시작
    initGame();
  </script>
</body>

</html>
